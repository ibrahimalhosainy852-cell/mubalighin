<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مبلغين</title>
<meta name="theme-color" content="#1F4E79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مبلغين">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #eef2f7; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; background: #1F4E79; color: #fff;
    font-family: Tahoma, sans-serif; transition: opacity .4s; z-index: 2;
  }
  #splash img { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  #splash .name { font-size: 22px; font-weight: bold; }
  #splash .wait { font-size: 14px; opacity: .8; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #offline {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: #eef2f7; color: #1d2733;
    font-family: Tahoma, sans-serif; text-align: center; padding: 24px; z-index: 3;
  }
  #offline button { font-family: inherit; font-size: 17px; padding: 12px 28px; border: 0; border-radius: 12px; background: #1F4E79; color: #fff; }
</style>
</head>
<body>
  <div id="splash">
    <img src="icon-192.png" alt="">
    <div class="name">مبلغين</div>
    <div class="wait">جاري التحميل...</div>
  </div>

  <div id="offline">
    <div style="font-size:40px">📶</div>
    <div style="font-size:18px;font-weight:bold">لا يوجد اتصال بالإنترنت</div>
    <div>تأكد من الاتصال ثم اضغط إعادة المحاولة</div>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>

  <iframe id="app" title="مبلغين"
    src="https://script.google.com/macros/s/AKfycbwRehfLOnejw0Xiis0sAP1QmTrasP5sI41lLems0sueDEjMcw4mr7nSd4Qm60CRqTaS4Q/exec"
    allow="camera; clipboard-write"></iframe>

<script>
  var app = document.getElementById('app');
  var splash = document.getElementById('splash');
  app.addEventListener('load', function () { splash.classList.add('hide'); });
  setTimeout(function () { splash.classList.add('hide'); }, 12000);

  if (!navigator.onLine) { document.getElementById('offline').style.display = 'flex'; }
  window.addEventListener('online', function () { location.reload(); });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
